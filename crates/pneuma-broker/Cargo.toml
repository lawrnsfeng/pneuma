[package]
name = "pneuma-broker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "NATS subject demux: one input subject fans out per tenant"

[dependencies]
pneuma-config = { path = "../pneuma-config" }
pneuma-nats = { path = "../pneuma-nats" }
pneuma-proto = { path = "../pneuma-proto" }
pneuma-serve = { path = "../pneuma-serve" }
async-nats = { workspace = true }
futures-lite = { workspace = true }
secrecy = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "rt", "rt-multi-thread", "macros", "net", "signal", "sync", "time",
] }
tokio-util = { workspace = true }

[dev-dependencies]
compact_str = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
