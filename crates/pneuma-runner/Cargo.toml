[package]
name = "pneuma-runner"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Drives a resolved pipeline to completion by calling components"

[dependencies]
pneuma-core = { path = "../pneuma-core" }
pneuma-interpreter = { path = "../pneuma-interpreter" }
pneuma-proto = { path = "../pneuma-proto" }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_yaml = "0.9"
